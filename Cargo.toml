[package]
name = "running-man-adv"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
sdl3 = { version = "0.18.4", features = ["build-from-source"] }

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[features]
default = []
cpu-trace = []
