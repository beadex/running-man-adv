[package]
name = "running-man-adv"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sdl3 = { version = "0.18.4", features = ["build-from-source"] }

[profile.dev]
# Keep debug symbols and overflow checks while avoiding an interpreter that is
# too slow for interactive use during development.
opt-level = 1
debug = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[features]
default = []
cpu-trace = []
perf-stats = []
